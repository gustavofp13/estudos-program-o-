<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="/pagina-processa-dados-do-form" method="post">
        <fieldset>
            <legend>Dados Gerais</legend>
            <label for="nome">Nome:</label>
            <input type="text" minlength="3" id="nome" />
            <label for="data_nascimento"> Data de Nascimento:</label>\
            <input type="text" id="data_nascimento">
            <label for="cpf">CPF:</label>
            <input type="cpf" minlength="11" id="cpf">
        </fieldset>

        <fieldset>
            <legend>Endereco</legend>
            <label for="Tipo">Tipo:</label>
            <select name="tipo" id="tipo">
                <option value="">Selecione</option>
                <option value="Ruas">Rua</option>
                <option value="Alameda">Alameda</option>
                <option value="Avenida">Avenida</option>
                <option value="Rodovia">Rodovia</option>
            </select>
            <label for="Logradouro">Logradouro:</label>
            <input type="text" id="Logradouro">
            <label for="Numero">Numero:</label>
            <input type="number" id="number">
            <label for="Complemento">Complemento:</label>
            <input type="text" id="complemento">
        </fieldset>

        <fieldset>
            <legend>Fale Conosco</legend>
            <label for="mensagem">Mensagem:</label>
            <textarea name="mensagem" id="msg" type="text" placeholder="Escreva sua mensagem"></textarea>

        </fieldset>
        <fieldset>
            <button>Enviar sua Mensagem</button>
            <button>Limpar Formulario</button>
        </fieldset>


    </form>
</body>

</html>
