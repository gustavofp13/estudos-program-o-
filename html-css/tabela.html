<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Tabela com cabecalho e rodape</h2>
    <table width="100%" border="1">

        <tr>
            <th>Mes</th>
            <th>Horas/Aula</th>
        </tr>
        <tr>
            <td>Junho</td>
            <td style="text-align: center;">50</td>

        </tr>
        <tr>
            <td>Julho</td>
            <td style="text-align: center;">50</td>
        </tr>
        <tr>
            <td style="text-align: center;"><Strong>Total</Strong></td>
            <td style="text-align: center;"><b>100</b></td>
        </tr>
    </table><br>

    <br>
    <h2>Tabela com cabecalho e rodape 2</h2>
    <table width="75%" border="2">
        <thead>
            <tr>
                <th>Mes</th>
                <th>Hora/Aula</th>
            </tr>
            <tr>
        <tbody>
            <tr>
                <td>Junho</td>
                <td>50</td>
            </tr>
            <tr>
                <td>Julho</td>
                <td>50</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th>Total</th>
                <th>100</th>
            </tr>
        </tfoot>
    </table><br>

    <h2>Tebela Simples</h2>
    <!--Tabela com Colspan-->
    <table width="100%" border="1">
        <tr>
            <td>Aluno</td>
            <td colspan="2">Disciplina</td>
        </tr>
        <tr>
            <td>Alex</td>
            <td>HTML</td>
            <td>Ambiente WEB</td>
        </tr>
    </table>


     <h2>Tebela Simples</h2>
    <!--Tabela com Rowspan-->
    <table width="100%" border="1">
        <tr>
            <td>Aluno</td>
            <td rowspan="2">Disciplina</td>
        </tr>
        <tr>
            <td>Alex</td>
            <td>HTML</td>
            <td>Ambiente WEB</td>
        </tr>
    </table>



<table> 
<tr><td>Col 1</td><td>Col 4</td></tr> 
<tr><td>Col 2</td><td>Col 5</td></tr> 
<tr><td>Col 3</td><td>Col 6</td></tr> 
</table>

</body>

</html>
